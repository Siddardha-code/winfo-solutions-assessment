# Default deny, then allow only what the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: support }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ticket-assistant, namespace: support }
spec:
  podSelector:
    matchLabels: { app: ticket-assistant }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }   # ALB ENIs live in the VPC (target-type: ip)
      ports: [{ protocol: TCP, port: 8000 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }     # Bedrock + STS over HTTPS (tighten with VPC endpoints)
      ports: [{ protocol: TCP, port: 443 }]
