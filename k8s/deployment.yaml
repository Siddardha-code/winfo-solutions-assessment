apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-assistant
  namespace: support
  labels: { app: ticket-assistant }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zero-downtime
  selector:
    matchLabels: { app: ticket-assistant }
  template:
    metadata:
      labels: { app: ticket-assistant }
    spec:
      serviceAccountName: ticket-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: ticket-assistant }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: ticket-assistant }
      containers:
        - name: api
          image: ticket-assistant   # replaced with the ECR image:sha by kustomize in CI
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ticket-assistant-config }
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: ticket-assistant-secrets, key: api-key, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
