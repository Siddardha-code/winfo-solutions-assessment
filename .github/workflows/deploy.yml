name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to AWS
  contents: read

concurrency: { group: deploy, cancel-in-progress: false }

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLUSTER: ${{ vars.EKS_CLUSTER }}
  ECR_REPO: ${{ vars.ECR_REPOSITORY }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

        - name: Show OIDC claims (temporary debug)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{sub, aud, repository, ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (immutable tag = git SHA)
        run: |
          docker build -t "$ECR_REPO:${SHA}" .
          docker push "$ECR_REPO:${SHA}"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Render manifests
        working-directory: k8s
        run: |
          kustomize edit set image ticket-assistant="$ECR_REPO:${SHA}"
          sed -i "s|__APP_ROLE_ARN__|${{ vars.APP_ROLE_ARN }}|" serviceaccount.yaml
          sed -i "s|us-east-1|${AWS_REGION}|" configmap.yaml

      - name: Deploy
        run: |
          kubectl apply -k k8s
          kubectl -n support rollout status deploy/ticket-assistant --timeout=180s

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: kubectl -n support rollout undo deploy/ticket-assistant || true
